name: Update Lake Levels

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape and update lake levels
        run: |
          python - <<'EOF'
          import json
          import re
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime, timezone

          SOURCES = {
              "watts_bar_lake": "https://www.wattsbar.info/Level/",
              "fort_loudoun_lake": "https://www.fortloudoun.info/Level/",
          }

          def scrape_level(url):
              response = requests.get(url, timeout=15)
              response.raise_for_status()
              soup = BeautifulSoup(response.text, "html.parser")
              # Look for an elevation value immediately before "Feet MSL"
              text = soup.get_text(" ")
              match = re.search(r'(\d{3,4}\.\d+)\s*Feet\s*MSL', text, re.IGNORECASE)
              if match:
                  return float(match.group(1))
              raise ValueError(f"Could not find elevation value on {url}")

          with open("data.json", "r") as f:
              data = json.load(f)

          timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          for key, url in SOURCES.items():
              try:
                  level = scrape_level(url)
                  data[key]["elevation_ft"] = level
                  data[key]["last_updated"] = timestamp
                  print(f"{key}: {level} ft")
              except Exception as e:
                  print(f"WARNING: Failed to scrape {key} from {url}: {e}")

          with open("data.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          EOF

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update lake levels [skip ci]"
          git push
